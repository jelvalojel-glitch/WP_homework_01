<!DOCTYPE html>
<html>
<body style="margin:0;background:#222;display:flex;justify-content:center;align-items:center;height:100vh">
<canvas id="c" width="600" height="400"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
const p = { x: 280, y: 180, w: 40, h: 40, speed: 4 };
const keys = {};
onkeydown = e => keys[e.key.toLowerCase()] = true;
onkeyup   = e => keys[e.key.toLowerCase()] = false;

function loop() {
  if (keys.arrowleft  || keys.a) p.x -= p.speed;
  if (keys.arrowright || keys.d) p.x += p.speed;
  if (keys.arrowup    || keys.w) p.y -= p.speed;
  if (keys.arrowdown  || keys.s) p.y += p.speed;

  // walls of the room (20px thick)
  p.x = Math.max(20, Math.min(600 - 20 - p.w, p.x));
  p.y = Math.max(20, Math.min(400 - 20 - p.h, p.y));

  ctx.fillStyle = '#555'; ctx.fillRect(0, 0, 600, 400);       // walls
  ctx.fillStyle = '#ddd'; ctx.fillRect(20, 20, 560, 360);     // floor
  ctx.fillStyle = '#e33'; ctx.fillRect(p.x, p.y, p.w, p.h);   // rectangle
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
